envVarGroups:
  - name: fabinzi-prod-runtime
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ENVIRONMENT
        value: production
      - key: PRIVATE_MEDIA_STORAGE_MODE
        value: s3
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: FABINZI_PUBLIC_BASE_URL
        value: https://fabinzi-prod-web.onrender.com
      - key: FABINZI_DEMO_SEED_ENABLED
        value: "false"
      - key: DEFAULT_LANGUAGE
        value: en
      - key: TIME_ZONE
        value: Africa/Cairo
      - key: SENTRY_ENABLED
        value: "false"
      - key: API_ANON_RATE
        value: 120/hour
      - key: API_USER_RATE
        value: 1200/hour

services:
  - type: keyvalue
    name: fabinzi-prod-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: fabinzi-prod-web
    runtime: docker
    branch: main
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz/
    dockerCommand: sh render-fresh-start.sh
    envVars:
      - fromGroup: fabinzi-prod-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: fabinzi-prod-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fabinzi-prod-redis
          property: connectionString
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_DESIGNER_EMAIL
        sync: false
      - key: DEMO_DESIGNER_PASSWORD
        sync: false
      - key: DEMO_MANUFACTURER_EMAIL
        sync: false
      - key: DEMO_MANUFACTURER_PASSWORD
        sync: false
      - key: DEMO_CUSTOMER_EMAIL
        sync: false
      - key: DEMO_CUSTOMER_PASSWORD
        sync: false

  - type: worker
    name: fabinzi-prod-worker
    runtime: docker
    branch: main
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    dockerCommand: celery -A config worker --loglevel=INFO --concurrency=2
    envVars:
      - fromGroup: fabinzi-prod-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: fabinzi-prod-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fabinzi-prod-redis
          property: connectionString

  - type: worker
    name: fabinzi-prod-beat
    runtime: docker
    branch: main
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    dockerCommand: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    envVars:
      - fromGroup: fabinzi-prod-runtime
      - key: DATABASE_URL
        fromDatabase:
          name: fabinzi-prod-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fabinzi-prod-redis
          property: connectionString

databases:
  - name: fabinzi-prod-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: fabinzi_prod
    user: fabinzi_prod
    ipAllowList: []
