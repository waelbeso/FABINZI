services:
  - type: web
    name: fabinzi-web
    runtime: docker
    branch: main
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FABINZI_INTEGRATIONS_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: fabinzi-db
          property: connectionString
      - key: FABINZI_BOOTSTRAP_DEMO_CATALOG
        value: "1"

databases:
  - name: fabinzi-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: fabinzi
    user: fabinzi
    ipAllowList: []
