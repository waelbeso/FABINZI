{% extends 'base.html' %}{% block content %}<section class="page-shell"><h1>Checkout</h1>{% if error %}<p class="alert">{{ error }}</p>{% endif %}<p>{{ checkout.studio_project.product.title_en }} · {{ checkout.total }} {{ checkout.currency }}</p><form method="post">{% csrf_token %}<input type="hidden" name="action" value="shipping"><label>Name<input name="shipping_name" value="{{ checkout.shipping_name }}" required></label><label>Phone<input name="shipping_phone" value="{{ checkout.shipping_phone }}" required></label><label>Email<input name="shipping_email" value="{{ checkout.shipping_email }}"></label><label>Address<input name="shipping_address1" value="{{ checkout.shipping_address1 }}" required></label><label>Address 2<input name="shipping_address2" value="{{ checkout.shipping_address2 }}"></label><label>City<input name="shipping_city" value="{{ checkout.shipping_city }}" required></label><label>Region<input name="shipping_region" value="{{ checkout.shipping_region }}"></label><label>Country<input name="shipping_country" value="{{ checkout.shipping_country|default:'EG' }}" maxlength="2" required></label><label>Postal code<input name="postal_code" value="{{ checkout.postal_code }}"></label><button type="submit">Save delivery details</button></form><form method="post">{% csrf_token %}<input type="hidden" name="action" value="place"><label>Payment<select name="payment_method"><option value="cod">Cash on Delivery</option><option value="paymob">Paymob</option><option value="stripe">Stripe</option></select></label><button type="submit">Place order</button></form></section>{% endblock %}
