{% extends 'base.html' %}{% block content %}<h1>Garment Designs</h1><p>Create and manage manufacturable garment designs.</p><form method="post">{% csrf_token %}<label>Designer business</label><select name="organization">{% for m in memberships %}<option value="{{ m.organization_id }}">{{ m.organization.display_name }}</option>{% endfor %}</select>{{ form.as_p }}<button type="submit">Create design</button></form><hr>{% for design in designs %}<p><a href="{% url 'designer-design-detail' design.pk %}">{{ design.title }}</a> — {{ design.get_status_display }}</p>{% empty %}<p>No garment designs yet.</p>{% endfor %}{% endblock %}
