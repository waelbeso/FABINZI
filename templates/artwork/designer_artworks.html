{% extends 'base.html' %}{% block content %}<h1>My Artwork</h1><form method="post">{% csrf_token %}<label>Designer business</label><select name="organization">{% for m in memberships %}<option value="{{ m.organization_id }}">{{ m.organization.display_name }}</option>{% endfor %}</select>{{ form.as_p }}<button type="submit">Create Artwork</button></form><hr>{% for artwork in artworks %}<p><a href="{% url 'designer-artwork-detail' artwork.pk %}">{{ artwork.title }}</a> — {{ artwork.get_status_display }}</p>{% empty %}<p>No artwork yet.</p>{% endfor %}{% endblock %}
