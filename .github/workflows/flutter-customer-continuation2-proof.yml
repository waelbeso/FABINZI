name: Manufacturer Payment Disclosure Probe

on: [pull_request]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: fabinzi
          POSTGRES_USER: fabinzi
          POSTGRES_PASSWORD: fabinzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.11
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://fabinzi:fabinzi@localhost:5432/fabinzi
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact checkpoint source
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "11"
          test "${{ github.event.pull_request.head.ref }}" = "work/flutter-customer-app"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "101b62220222f6372b11dfd5c76bd71aee1ab420"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release.txt
      - name: Install exact release dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip check
      - name: Prepare exact database
        run: |
          python manage.py reconcile_migration_state
          python manage.py migrate --noinput
      - name: Render exact Manufacturer detail and report every cod context
        run: pytest -q tests/test_manufacturer_cod_diagnostic.py -s
