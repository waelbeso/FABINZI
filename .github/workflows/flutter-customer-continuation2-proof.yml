name: Flutter Customer Continuation 2 Proof

on: [pull_request]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  FLUTTER_INTEGRATION_BASE_SHA: 101b62220222f6372b11dfd5c76bd71aee1ab420

jobs:
  quality-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact source and locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "$FLUTTER_INTEGRATION_BASE_SHA"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Enforce committed dependency resolution
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Frozen Customer API no drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$FLUTTER_INTEGRATION_BASE_SHA"...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
      - name: Format and analyze
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test tool/verify_customer_contract.dart
          flutter analyze
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Complete Flutter tests
        working-directory: mobile/customer_app
        run: flutter test --reporter expanded
      - name: Localization and theme checks
        working-directory: mobile/customer_app
        run: flutter test test/localization_theme_test.dart --reporter expanded
      - name: Frozen Customer contract compatibility
        working-directory: mobile/customer_app
        run: dart run tool/verify_customer_contract.dart
      - name: Generate Android host preserving committed definitions
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --no-pub --platforms=android --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Android debug build
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk

  ios-unsigned-device:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact source and locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "$FLUTTER_INTEGRATION_BASE_SHA"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Select Xcode 26.3
        working-directory: mobile/customer_app
        shell: bash
        run: |
          mkdir -p continuation2-ios-evidence
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | tee continuation2-ios-evidence/xcode-version.txt
      - name: Generate iOS host preserving committed definitions
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --no-pub --platforms=ios --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Configure Flutter iOS project
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign --config-only
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          cd ios
          pod install
      - name: Real unsigned iphoneos build
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build/ios-unsigned
          xcrun xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee continuation2-ios-evidence/xcodebuild-unsigned.log
          app=build/ios-unsigned/Build/Products/Debug-iphoneos/Runner.app
          test -d "$app"
          test -x "$app/Runner"
          file "$app/Runner" | tee continuation2-ios-evidence/runner-binary.txt
          xcrun lipo -info "$app/Runner" | tee continuation2-ios-evidence/runner-architecture.txt
          if codesign -dv "$app" > continuation2-ios-evidence/codesign-check.txt 2>&1; then
            echo 'Unexpected code signature on unsigned proof.'
            exit 1
          fi
          printf 'PASS — unsigned iphoneos device build with signing disabled\n' | tee continuation2-ios-evidence/ios-unsigned-result.txt
      - name: Upload unsigned iOS proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-customer-continuation2-ios
          path: mobile/customer_app/continuation2-ios-evidence
          if-no-files-found: warn
          retention-days: 7
