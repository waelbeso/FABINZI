name: V2-8 Apply Manufacturer Source Fix

on:
  push:
    branches: [work/v2-finance-royalties-payables-payout]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage V2-8 immutable manufacturer source correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/v2-finance-royalties-payables-payout
          fetch-depth: 0
      - name: Apply exact V2-8 manufacturer source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/finance/services.py')
          text = path.read_text()
          old = '''    if job:\n        try: specification = job.production_specification\n        except ProductionSpecification.DoesNotExist: pass\n        if getattr(job, "selection_id", None): quote = job.selection.quote\n    quote_data = None\n    if quote:\n        quote_data = {"quote_id": quote.pk, "manufacturer_id": job.manufacturer_id, "currency": quote.currency.upper(), "unit_price": str(_money(quote.unit_price)), "setup_fee": str(_money(quote.setup_fee or 0)), "sample_fee": str(_money(quote.sample_fee or 0)), "shipping_estimate": str(_money(quote.shipping_estimate or 0))}\n'''
          new = '''    if job:\n        try: specification = job.production_specification\n        except ProductionSpecification.DoesNotExist: pass\n        if specification and specification.accepted_quote_id:\n            quote = specification.accepted_quote\n        elif getattr(job, "selection_id", None):\n            quote = job.selection.quote\n    quote_data = None\n    if specification:\n        immutable_offer = dict((specification.snapshot or {}).get("manufacturing_offer") or {})\n        immutable_assignment = dict((specification.snapshot or {}).get("assignment") or {})\n        if immutable_offer:\n            quote_data = {\n                "quote_id": immutable_offer.get("quote_id") or specification.accepted_quote_id,\n                "manufacturer_id": immutable_assignment.get("manufacturer_id") or specification.manufacturer_id,\n                "currency": str(immutable_offer.get("currency") or "").upper(),\n                "unit_price": immutable_offer.get("unit_price"),\n                "setup_fee": immutable_offer.get("setup_fee"),\n                "sample_fee": immutable_offer.get("sample_fee"),\n                "shipping_estimate": immutable_offer.get("shipping_estimate"),\n            }\n    if quote_data is None and quote:\n        quote_data = {"quote_id": quote.pk, "manufacturer_id": job.manufacturer_id, "currency": quote.currency.upper(), "unit_price": str(_money(quote.unit_price)), "setup_fee": str(_money(quote.setup_fee or 0)), "sample_fee": str(_money(quote.sample_fee or 0)), "shipping_estimate": str(_money(quote.shipping_estimate or 0))}\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected exact manufacturer source block once; refusing ambiguous patch.')
          text = text.replace(old, new)
          old_payable = '''def _manufacturer_payable(policy, source):\n    quote = source.get("manufacturer_quote")\n    if not quote: return Decimal("0.00")\n    if quote["currency"].upper() != source["currency"].upper(): raise ValidationError("Manufacturer quote currency differs from immutable order currency; FX policy is not configured.")\n'''
          new_payable = '''def _manufacturer_payable(policy, source):\n    quote = source.get("manufacturer_quote")\n    if not quote: return Decimal("0.00")\n    required = ("quote_id", "manufacturer_id", "currency", "unit_price", "setup_fee", "sample_fee", "shipping_estimate")\n    if any(quote.get(key) in {None, ""} for key in required):\n        raise FinancePolicyUnavailable("Immutable Manufacturing Offer snapshot is incomplete; Manufacturer payable remains blocked.")\n    if quote["currency"].upper() != source["currency"].upper(): raise ValidationError("Manufacturer quote currency differs from immutable order currency; FX policy is not configured.")\n'''
          if text.count(old_payable) != 1:
              raise SystemExit('Expected exact manufacturer payable block once; refusing ambiguous patch.')
          path.write_text(text.replace(old_payable, new_payable))
          PY
          rm .github/workflows/v2-8-apply-manufacturer-source-fix.yml
          python -m compileall -q apps/finance
          git diff --check
          git diff -- apps/finance/services.py
          test ! -e .github/workflows/v2-8-apply-manufacturer-source-fix.yml
      - name: Commit clean correction tree
        shell: bash
        run: |
          git config user.name 'Wael El-Begearmi'
          git config user.email 'waelabbas@live.com'
          git add apps/finance/services.py .github/workflows/v2-8-apply-manufacturer-source-fix.yml
          git commit -m 'Use immutable V2-7 Manufacturing Offer for V2-8 finance'
          git push origin HEAD:work/v2-finance-royalties-payables-payout
