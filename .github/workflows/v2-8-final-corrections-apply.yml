name: V2-8 Apply Final Corrections
on:
  push:
    branches: [work/v2-finance-royalties-payables-payout]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Stage V2-8 final corrections transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/v2-finance-royalties-payables-payout
          fetch-depth: 0
      - name: Apply exact corrections
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' FSTklOR31cbFYyX1NFVFRMRU1FTlRfRU FSTklOR19UWVBFUyA9IHtMZWRnZXJFbnRyeS5FbnRyeVR5cGUuR0FSTUVOVF9ERVNJR05FUl9ST1lBTFRZLCBMZWRnZXJFbnRyeS5FbnRyeVR5cGUuQVJUV09SS19ERVNJR05FUl9ST1lBTFRZLCBMZWRnZXJFbnRyeS5FbnRyeVR5cGUuTUFOVUZBQ1RVUkVSX1BBWUFCTEV9XG5cbmN sYXNzIEZpbmFuY2VQb2xpY3lVbmF2YWlsYWJsZScKbmV3PW5ldy5yZXBsYWNlKCdF RU  ...<base64-truncated-for-display>...' | base64 -d > /tmp/apply_v28.py
          python /tmp/apply_v28.py
          rm .github/workflows/v2-8-final-corrections-apply.yml
          python -m compileall -q apps tests
          git diff --check
          test ! -e .github/workflows/v2-8-final-corrections-apply.yml
      - name: Commit clean correction tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wael El-Begearmi'
          git config user.email 'waelabbas@live.com'
          git add apps/finance/services.py tests/test_v2_8_finance_boundaries.py templates/maneg/finance.html .github/workflows/flutter-customer.yml .github/workflows/v2-8-final-corrections-apply.yml
          git commit -m 'Preserve legacy finance and deterministic Flutter evidence'
          git push origin HEAD:work/v2-finance-royalties-payables-payout
