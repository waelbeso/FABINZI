name: V2-8 Apply Final Patch

on:
  push:
    branches: [work/v2-finance-royalties-payables-payout]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply V2-8 non-workflow corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/v2-finance-royalties-payables-payout
          fetch-depth: 0
      - name: Apply finance and Maneg corrections
        shell: bash
        run: |
          set -euo pipefail
          python .github/v2_8_final_patch.py
          git checkout HEAD -- .github/workflows/flutter-customer.yml
          rm .github/v2_8_final_patch.py
          python -m compileall -q apps tests
          git diff --check
          test ! -e .github/v2_8_final_patch.py
          git diff -- apps/finance/services.py tests/test_v2_8_finance_boundaries.py templates/maneg/finance.html
      - name: Commit product corrections without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wael El-Begearmi'
          git config user.email 'waelabbas@live.com'
          git add apps/finance/services.py tests/test_v2_8_finance_boundaries.py templates/maneg/finance.html .github/v2_8_final_patch.py
          git commit -m 'Preserve legacy finance and Maneg compatibility'
          git push origin HEAD:work/v2-finance-royalties-payables-payout
