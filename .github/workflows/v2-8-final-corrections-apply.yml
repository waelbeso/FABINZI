name: V2-8 Apply Final Verification Corrections

on:
  push:
    branches: [work/v2-finance-royalties-payables-payout]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage V2-8 final verification corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/v2-finance-royalties-payables-payout
          fetch-depth: 0
      - name: Apply exact narrow V2-8 corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Provenance-aware settlement policy resolution.
          path = Path('apps/finance/services.py')
          text = path.read_text()
          old = '''OPEN_SETTLEMENT = {SettlementRequest.Status.REQUESTED, SettlementRequest.Status.UNDER_REVIEW, SettlementRequest.Status.APPROVED, SettlementRequest.Status.PROCESSING}\n\n\nclass FinancePolicyUnavailable'''
          new = '''OPEN_SETTLEMENT = {SettlementRequest.Status.REQUESTED, SettlementRequest.Status.UNDER_REVIEW, SettlementRequest.Status.APPROVED, SettlementRequest.Status.PROCESSING}\nLEGACY_SETTLEMENT_EARNING_TYPES = {LedgerEntry.EntryType.DESIGNER_EARNING, LedgerEntry.EntryType.MANUFACTURER_EARNING}\nV2_SETTLEMENT_EARNING_TYPES = {LedgerEntry.EntryType.GARMENT_DESIGNER_ROYALTY, LedgerEntry.EntryType.ARTWORK_DESIGNER_ROYALTY, LedgerEntry.EntryType.MANUFACTURER_PAYABLE}\n\n\nclass FinancePolicyUnavailable'''
          if text.count(old) != 1:
              raise SystemExit('Expected finance constants anchor exactly once.')
          text = text.replace(old, new)

          anchor = '''def _idempotent_settlement(*, key, organization, amount, currency):\n    if not key: return None\n    existing = SettlementRequest.objects.filter(idempotency_key=key).first()\n    if not existing: return None\n    if existing.organization_id != organization.pk: raise PermissionDenied("Settlement idempotency key belongs to another organization.")\n    if existing.currency.upper() != currency.upper() or _money(existing.amount) != _money(amount): raise ValidationError("Settlement idempotency key was already used with different amount/currency.")\n    return existing\n\n\n@transaction.atomic\ndef request_settlement'''
          replacement = '''def _idempotent_settlement(*, key, organization, amount, currency):\n    if not key: return None\n    existing = SettlementRequest.objects.filter(idempotency_key=key).first()\n    if not existing: return None\n    if existing.organization_id != organization.pk: raise PermissionDenied("Settlement idempotency key belongs to another organization.")\n    if existing.currency.upper() != currency.upper() or _money(existing.amount) != _money(amount): raise ValidationError("Settlement idempotency key was already used with different amount/currency.")\n    return existing\n\n\ndef _settlement_policy_resolution(*, account, currency):\n    has_legacy = account.ledger_entries.filter(entry_type__in=LEGACY_SETTLEMENT_EARNING_TYPES, amount__gt=0).exists()\n    has_v2 = account.ledger_entries.filter(entry_type__in=V2_SETTLEMENT_EARNING_TYPES, amount__gt=0).exists()\n    if has_legacy and has_v2:\n        raise ValidationError("Mixed legacy/V2 finance provenance requires explicit payout allocation before settlement.")\n    if has_legacy:\n        policy = FinancePolicy.objects.filter(is_active=True, lifecycle_status=FinancePolicy.LifecycleStatus.DRAFT).order_by("id").first()\n        if not policy or policy.is_v2_complete:\n            raise ValidationError("Legacy settlement requires an explicitly configured legacy Finance Policy; V2 policy is not a fallback.")\n        return {"provenance": "legacy", "policy": policy, "minimum_payout": _money(policy.minimum_payout)}\n    policy = active_policy(currency)\n    return {"provenance": "v2", "policy": policy, "minimum_payout": _money(policy.v2_minimum_payout)}\n\n\n@transaction.atomic\ndef request_settlement'''
          if text.count(anchor) != 1:
              raise SystemExit('Expected settlement helper anchor exactly once.')
          text = text.replace(anchor, replacement)
          old = '''    policy = active_policy(currency)\n    if amount < policy.v2_minimum_payout: raise ValidationError(f"Minimum settlement is {policy.v2_minimum_payout} {currency}.")'''
          new = '''    resolution = _settlement_policy_resolution(account=account, currency=currency)\n    minimum_payout = resolution["minimum_payout"]\n    if amount < minimum_payout: raise ValidationError(f"Minimum settlement is {minimum_payout} {currency}.")'''
          if text.count(old) != 1:
              raise SystemExit('Expected V2-only settlement minimum block exactly once.')
          path.write_text(text.replace(old, new))

          # 2) Add focused regression coverage for isolated legacy/V2 provenance.
          path = Path('tests/test_v2_8_finance_boundaries.py')
          text = path.read_text()
          old = 'from apps.finance.services import account_balance, payout_iban, request_settlement, update_payout_profile\n'
          new = 'from apps.finance.services import FinancePolicyUnavailable, account_balance, payout_iban, request_settlement, update_payout_profile\n'
          if text.count(old) != 1:
              raise SystemExit('Expected finance service import exactly once.')
          text = text.replace(old, new)
          appendix = r'''


def test_legacy_settlement_uses_only_configured_legacy_policy_without_v2_default():
    owner = user("v28-legacy-settlement-owner")
    organization = org(owner, kind=Organization.Kind.DESIGNER, name="V2-8 Legacy Settlement Org")
    legacy = FinancePolicy.objects.create(name="SYNTHETIC LEGACY SETTLEMENT", minimum_payout=Decimal("100.00"), is_active=True)
    account = FinanceAccount.objects.create(account_type=FinanceAccount.AccountType.ORGANIZATION, organization=organization, currency="EGP")
    LedgerEntry.objects.create(account=account, entry_type=LedgerEntry.EntryType.DESIGNER_EARNING, amount=Decimal("500.00"), currency="EGP", available_at=timezone.now(), memo="SYNTHETIC legacy earning")
    PayoutProfile.objects.create(organization=organization, method=PayoutProfile.Method.MANUAL, account_holder="Legacy Owner", destination_hint="MANUAL-LEGACY-QA", status=PayoutProfile.Status.VERIFIED)
    assert not FinancePolicy.objects.filter(lifecycle_status=FinancePolicy.LifecycleStatus.ACTIVE).exists()
    with pytest.raises(ValidationError):
        request_settlement(organization=organization, actor=owner, amount="99.00", currency="EGP", idempotency_key="legacy-too-low")
    settlement = request_settlement(organization=organization, actor=owner, amount="100.00", currency="EGP", idempotency_key="legacy-accepted")
    assert settlement.amount == Decimal("100.00")
    assert legacy.minimum_payout == Decimal("100.00")


def test_unconfigured_v2_obligation_never_falls_back_to_legacy_policy():
    owner = user("v28-v2-no-fallback-owner")
    organization = org(owner, kind=Organization.Kind.DESIGNER, name="V2-8 No Fallback Org")
    FinancePolicy.objects.create(name="SYNTHETIC LEGACY NO FALLBACK", minimum_payout=Decimal("1.00"), is_active=True)
    account = FinanceAccount.objects.create(account_type=FinanceAccount.AccountType.ORGANIZATION, organization=organization, currency="EGP")
    LedgerEntry.objects.create(account=account, entry_type=LedgerEntry.EntryType.GARMENT_DESIGNER_ROYALTY, amount=Decimal("500.00"), currency="EGP", available_at=timezone.now(), memo="SYNTHETIC unconfigured V2 obligation")
    PayoutProfile.objects.create(organization=organization, method=PayoutProfile.Method.MANUAL, account_holder="V2 Owner", destination_hint="MANUAL-V2-QA", status=PayoutProfile.Status.VERIFIED)
    with pytest.raises(FinancePolicyUnavailable):
        request_settlement(organization=organization, actor=owner, amount="100.00", currency="EGP", idempotency_key="v2-no-legacy-fallback")


def test_mixed_legacy_and_v2_settlement_provenance_fails_closed_without_allocation_rule():
    owner = user("v28-mixed-provenance-owner")
    organization = org(owner, kind=Organization.Kind.DESIGNER, name="V2-8 Mixed Provenance Org")
    FinancePolicy.objects.create(name="SYNTHETIC LEGACY MIXED", minimum_payout=Decimal("1.00"), is_active=True)
    _active_policy("MIXEDPROV", minimum="1.00")
    account = FinanceAccount.objects.create(account_type=FinanceAccount.AccountType.ORGANIZATION, organization=organization, currency="EGP")
    LedgerEntry.objects.create(account=account, entry_type=LedgerEntry.EntryType.DESIGNER_EARNING, amount=Decimal("250.00"), currency="EGP", available_at=timezone.now(), memo="SYNTHETIC legacy portion")
    LedgerEntry.objects.create(account=account, entry_type=LedgerEntry.EntryType.GARMENT_DESIGNER_ROYALTY, amount=Decimal("250.00"), currency="EGP", available_at=timezone.now(), memo="SYNTHETIC V2 portion")
    PayoutProfile.objects.create(organization=organization, method=PayoutProfile.Method.MANUAL, account_holder="Mixed Owner", destination_hint="MANUAL-MIXED-QA", status=PayoutProfile.Status.VERIFIED)
    with pytest.raises(ValidationError, match="Mixed legacy/V2 finance provenance"):
        request_settlement(organization=organization, actor=owner, amount="100.00", currency="EGP", idempotency_key="mixed-provenance")
'''
          if 'test_legacy_settlement_uses_only_configured_legacy_policy_without_v2_default' in text:
              raise SystemExit('Legacy/V2 provenance tests already present unexpectedly.')
          path.write_text(text.rstrip() + appendix + '\n')

          # 3) Restore accepted /Maneg/ review controls while retaining V2-8 governance links.
          template = r'''{% extends 'maneg/base.html' %}{% load maneg %}
{% block page_intro %}<p>{% if maneg_is_ar %}أرصدة مشتقة من دفتر الأستاذ الفعلي، مع حوكمة سياسة V2 منفصلة وقابلة للتدقيق وإخفاء تفاصيل الدفع الحساسة.{% else %}Balances derived from the real ledger, with separately governed auditable V2 Finance Policy controls and sensitive payout details masked.{% endif %}</p>{% endblock %}
{% block page_actions %}<div class="action-row">{% if request.user|has_perm_name:'finance.view_finance_policy_governance' %}<a class="button button--ghost" href="{% url 'fabinzi_admin:maneg-v2-8-finance-policies' %}">V2 Finance Policies</a>{% endif %}{% if request.user|has_perm_name:'finance.reconcile_finance_recognition' %}<a class="button button--ghost" href="{% url 'fabinzi_admin:maneg-v2-8-finance-pending' %}">Pending reconciliation</a>{% endif %}{% if request.user|has_perm_name:'finance.view_settlementrequest' %}<a class="button button--ghost" href="{% url 'fabinzi_admin:maneg-v2-8-finance-payouts' %}">V2 Payout operations</a>{% endif %}</div>{% endblock %}
{% block content %}
<section class="panel"><h2>V2 finance governance</h2><p class="muted">Legacy Stage-8 compatibility fields remain isolated from V2 policy resolution. V2 recognition continues to require explicit complete policy governance.</p></section>
<section class="panel"><h2>{% if maneg_is_ar %}حسابات دفتر الأستاذ{% else %}Ledger accounts{% endif %}</h2><div class="finance-cards mobile-only">{% for a in accounts %}<article class="subcard"><strong>{% if a.organization %}{{ a.organization.display_name }}{% else %}{% if maneg_is_ar %}حساب المنصة{% else %}Platform account{% endif %}{% endif %}</strong><span>{{ a.currency }} · {% if maneg_is_ar %}متاح{% else %}Available{% endif %} {{ a.maneg_balance.available }} · {% if maneg_is_ar %}قابل للسحب{% else %}Withdrawable{% endif %} {{ a.maneg_balance.withdrawable }}</span></article>{% empty %}<div class="empty-state">{% if maneg_is_ar %}لا توجد حسابات مالية مرئية.{% else %}No visible finance accounts.{% endif %}</div>{% endfor %}</div><div class="table-wrap desktop-only"><table class="maneg-table"><thead><tr><th>{% if maneg_is_ar %}الحساب{% else %}Account{% endif %}</th><th>{% if maneg_is_ar %}العملة{% else %}Currency{% endif %}</th><th>{% if maneg_is_ar %}الإجمالي{% else %}Total{% endif %}</th><th>{% if maneg_is_ar %}متاح{% else %}Available{% endif %}</th><th>{% if maneg_is_ar %}معلّق{% else %}Pending{% endif %}</th><th>{% if maneg_is_ar %}محجوز{% else %}Reserved{% endif %}</th><th>{% if maneg_is_ar %}قابل للسحب{% else %}Withdrawable{% endif %}</th></tr></thead><tbody>{% for a in accounts %}<tr><td>{% if a.organization %}{{ a.organization.display_name }}{% else %}FABINZI Platform{% endif %}</td><td>{{ a.currency }}</td><td>{{ a.maneg_balance.total }}</td><td>{{ a.maneg_balance.available }}</td><td>{{ a.maneg_balance.pending }}</td><td>{{ a.maneg_balance.reserved }}</td><td>{{ a.maneg_balance.withdrawable }}</td></tr>{% empty %}<tr><td colspan="7"><div class="empty-state">{% if maneg_is_ar %}لا توجد حسابات مالية مرئية.{% else %}No visible finance accounts.{% endif %}</div></td></tr>{% endfor %}</tbody></table></div></section>
<div class="panel-grid"><section class="panel"><h2>{% if maneg_is_ar %}ملفات التحويل{% else %}Payout profiles{% endif %}</h2>{% for p in payouts %}<article class="subcard"><div class="section-head"><div><strong>{{ p.organization.display_name }}</strong><span>{{ p.method|maneg_label:maneg_language }} · {{ p.account_holder }} · {{ p.destination_hint }}</span></div><span class="status status--{{ p.status|maneg_tone }}">{{ p.status|maneg_label:maneg_language }}</span></div>{% if p.status == 'pending' and request.user|has_perm_name:'finance.change_payoutprofile' %}<form method="post" class="action-row">{% csrf_token %}<input type="hidden" name="profile_id" value="{{ p.pk }}"><button class="button button--sm" name="action" value="verify_payout">{% if maneg_is_ar %}توثيق{% else %}Verify{% endif %}</button><button class="button button--danger button--sm" name="action" value="reject_payout">{% if maneg_is_ar %}رفض{% else %}Reject{% endif %}</button></form>{% endif %}</article>{% empty %}<div class="empty-state">{% if maneg_is_ar %}لا توجد ملفات تحويل مرئية.{% else %}No visible payout profiles.{% endif %}</div>{% endfor %}</section>
<section class="panel"><h2>{% if maneg_is_ar %}طلبات التسوية{% else %}Settlement requests{% endif %}</h2>{% for s in settlements %}<article class="subcard"><div class="section-head"><div><strong>{{ s.organization.display_name }} · {{ s.amount }} {{ s.currency }}</strong><span>{{ s.requested_at }}</span></div><span class="status status--{{ s.status|maneg_tone }}">{{ s.status|maneg_label:maneg_language }}</span></div>{% if request.user|has_perm_name:'finance.change_settlementrequest' and s.status == 'requested' %}<form method="post" class="action-row">{% csrf_token %}<input type="hidden" name="settlement_id" value="{{ s.pk }}"><button class="button button--sm" name="action" value="approve_settlement">{% if maneg_is_ar %}اعتماد{% else %}Approve{% endif %}</button><button class="button button--danger button--sm" name="action" value="reject_settlement">{% if maneg_is_ar %}رفض{% else %}Reject{% endif %}</button></form>{% endif %}</article>{% empty %}<div class="empty-state">{% if maneg_is_ar %}لا توجد تسويات مرئية.{% else %}No visible settlement requests.{% endif %}</div>{% endfor %}</section></div>
<section class="panel"><h2>{% if maneg_is_ar %}تخصيصات الطلبات الفعلية{% else %}Recognized order finance{% endif %}</h2>{% for f in order_finances %}<div class="row-item"><strong>{{ f.order.number }} · {{ f.gross_amount }} {{ f.currency }}</strong><span>Policy {{ f.policy_snapshot.code|default:"legacy" }} · Manufacturer {{ f.manufacturer_payable }} · Garment royalty {{ f.garment_designer_royalty }} · Artwork royalty {{ f.artwork_designer_royalty }} · FABINZI {{ f.fabinzi_component }}</span></div>{% empty %}<div class="empty-state">{% if maneg_is_ar %}لا توجد تخصيصات مالية معترف بها.{% else %}No recognized order-finance records.{% endif %}</div>{% endfor %}</section>
{% endblock %}
'''
          Path('templates/maneg/finance.html').write_text(template)

          # 4) Make Flutter guard evidence deterministic without touching Flutter source/tests.
          path = Path('.github/workflows/flutter-customer.yml')
          text = path.read_text()
          old = '''      - name: Checkpoint behavior evidence\n        working-directory: mobile/customer_app\n        shell: bash\n        run: |\n          set -euo pipefail\n          grep -F 'checkout submission guard allows only one active placement per checkout' build-evidence/tests.log\n          grep -F 'placement key is stable per checkout/provider and distinct across providers' build-evidence/preferences-tests.log\n          grep -F 'checkout placement sends the persisted Idempotency-Key unchanged' build-evidence/api-client-tests.log\n          grep -F 'Studio quantity update uses the frozen PATCH quantity field' build-evidence/api-client-tests.log\n          printf 'PASS — submission guard + persisted Idempotency-Key replay behavior\\n' > build-evidence/checkout-idempotency-result.txt\n          printf 'PASS — Studio quantity serialized via frozen PATCH quantity and canonical response\\n' > build-evidence/studio-quantity-result.txt\n'''
          new = '''      - name: Checkout submission guard evidence\n        working-directory: mobile/customer_app\n        shell: bash\n        run: |\n          set -euo pipefail\n          set -o pipefail\n          test -f test/checkout_submission_guard_test.dart\n          grep -Fx 'test/checkout_submission_guard_test.dart' build-evidence/test-inventory.txt\n          flutter test test/checkout_submission_guard_test.dart --reporter expanded 2>&1 | tee build-evidence/checkout-submission-guard-tests.log\n          grep -F 'checkout submission guard allows only one active placement per checkout' build-evidence/checkout-submission-guard-tests.log\n          printf 'PASS — explicit checkout_submission_guard_test.dart execution proved single active placement per checkout\\n' > build-evidence/checkout-submission-guard-test-result.txt\n      - name: Checkpoint behavior evidence\n        working-directory: mobile/customer_app\n        shell: bash\n        run: |\n          set -euo pipefail\n          grep -F 'checkout submission guard allows only one active placement per checkout' build-evidence/checkout-submission-guard-tests.log\n          grep -F 'placement key is stable per checkout/provider and distinct across providers' build-evidence/preferences-tests.log\n          grep -F 'checkout placement sends the persisted Idempotency-Key unchanged' build-evidence/api-client-tests.log\n          grep -F 'Studio quantity update uses the frozen PATCH quantity field' build-evidence/api-client-tests.log\n          printf 'PASS — submission guard + persisted Idempotency-Key replay behavior\\n' > build-evidence/checkout-idempotency-result.txt\n          printf 'PASS — Studio quantity serialized via frozen PATCH quantity and canonical response\\n' > build-evidence/studio-quantity-result.txt\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected Flutter checkpoint evidence block exactly once.')
          text = text.replace(old, new)
          old = '''          cp evidence/quality/preferences-test-result.txt "$out/"\n          cp evidence/quality/preferences-tests.log "$out/"\n          cp evidence/quality/localization-theme-result.txt "$out/"\n'''
          new = '''          cp evidence/quality/preferences-test-result.txt "$out/"\n          cp evidence/quality/preferences-tests.log "$out/"\n          cp evidence/quality/checkout-submission-guard-test-result.txt "$out/"\n          cp evidence/quality/checkout-submission-guard-tests.log "$out/"\n          cp evidence/quality/localization-theme-result.txt "$out/"\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected Flutter evidence assembly block exactly once.')
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/v2-8-final-corrections-apply.yml
          python -m compileall -q apps tests
          git diff --check
          test ! -e .github/workflows/v2-8-final-corrections-apply.yml
          git diff -- apps/finance/services.py tests/test_v2_8_finance_boundaries.py templates/maneg/finance.html .github/workflows/flutter-customer.yml
      - name: Commit clean V2-8 correction tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wael El-Begearmi'
          git config user.email 'waelabbas@live.com'
          git add apps/finance/services.py tests/test_v2_8_finance_boundaries.py templates/maneg/finance.html .github/workflows/flutter-customer.yml .github/workflows/v2-8-final-corrections-apply.yml
          git commit -m 'Preserve legacy finance and deterministic Flutter evidence'
          git push origin HEAD:work/v2-finance-royalties-payables-payout
