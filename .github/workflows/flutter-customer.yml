name: Flutter Customer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-customer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  FLUTTER_INTEGRATION_BASE_SHA: 101b62220222f6372b11dfd5c76bd71aee1ab420

jobs:
  quality-preview:
    name: Continuation 2 analyzer tests Android proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source and branch locks
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse origin/feature/web-productization)" = "$FLUTTER_INTEGRATION_BASE_SHA"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Resolve committed lock without changing analysis policy
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Apply exact Continuation 2 corrections in runner workspace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          cart_path = Path('mobile/customer_app/lib/features/cart/cart_screen.dart')
          cart = cart_path.read_text()
          replacements = {
              "import 'package:flutter_stripe/flutter_stripe.dart';": "import 'package:flutter_stripe/flutter_stripe.dart' as stripe;",
              'Stripe.instance': 'stripe.Stripe.instance',
              'SetupPaymentSheetParameters(': 'stripe.SetupPaymentSheetParameters(',
              'on StripeException catch': 'on stripe.StripeException catch',
              'FailureCode.Canceled': 'stripe.FailureCode.Canceled',
          }
          for old, new in replacements.items():
              if old not in cart:
                  raise SystemExit(f'Expected Stripe token not found: {old}')
              cart = cart.replace(old, new)
          old_payment = """          else
            ...options.map(
              (option) => RadioListTile<String>(
                value: option.provider,
                groupValue: provider,
                onChanged: placing
                    ? null
                    : (value) => setState(() => provider = value),
                title: Text(option.label),
              ),
            ),
"""
          new_payment = """          else
            RadioGroup<String>(
              groupValue: provider,
              onChanged: (value) {
                if (!placing && value != null) {
                  setState(() => provider = value);
                }
              },
              child: Column(
                children: [
                  for (final option in options)
                    RadioListTile<String>(
                      value: option.provider,
                      enabled: !placing,
                      title: Text(option.label),
                    ),
                ],
              ),
            ),
"""
          if old_payment not in cart:
              raise SystemExit('Expected checkout payment radio block not found')
          cart_path.write_text(cart.replace(old_payment, new_payment))

          account_path = Path('mobile/customer_app/lib/features/account/account_screen.dart')
          account = account_path.read_text()
          old_language = """      RadioListTile<String>(
        value: 'en',
        groupValue: controller.locale.languageCode,
        onChanged: (value) {
          if (value != null) controller.setLocale(value);
        },
        title: Text(L10n.t(context, 'english')),
      ),
      RadioListTile<String>(
        value: 'ar',
        groupValue: controller.locale.languageCode,
        onChanged: (value) {
          if (value != null) controller.setLocale(value);
        },
        title: Text(L10n.t(context, 'arabic')),
      ),
"""
          new_language = """      RadioGroup<String>(
        groupValue: controller.locale.languageCode,
        onChanged: (value) {
          if (value != null) {
            controller.setLocale(value);
          }
        },
        child: Column(
          children: [
            RadioListTile<String>(
              value: 'en',
              title: Text(L10n.t(context, 'english')),
            ),
            RadioListTile<String>(
              value: 'ar',
              title: Text(L10n.t(context, 'arabic')),
            ),
          ],
        ),
      ),
"""
          if old_language not in account:
              raise SystemExit('Expected language radio block not found')
          account = account.replace(old_language, new_language)
          old_theme = """      RadioListTile<ThemeMode>(
        value: ThemeMode.system,
        groupValue: controller.themeMode,
        onChanged: (value) {
          if (value != null) controller.setThemeMode(value);
        },
        title: Text(L10n.t(context, 'system')),
      ),
      RadioListTile<ThemeMode>(
        value: ThemeMode.light,
        groupValue: controller.themeMode,
        onChanged: (value) {
          if (value != null) controller.setThemeMode(value);
        },
        title: Text(L10n.t(context, 'light')),
      ),
      RadioListTile<ThemeMode>(
        value: ThemeMode.dark,
        groupValue: controller.themeMode,
        onChanged: (value) {
          if (value != null) controller.setThemeMode(value);
        },
        title: Text(L10n.t(context, 'dark')),
      ),
"""
          new_theme = """      RadioGroup<ThemeMode>(
        groupValue: controller.themeMode,
        onChanged: (value) {
          if (value != null) {
            controller.setThemeMode(value);
          }
        },
        child: Column(
          children: [
            RadioListTile<ThemeMode>(
              value: ThemeMode.system,
              title: Text(L10n.t(context, 'system')),
            ),
            RadioListTile<ThemeMode>(
              value: ThemeMode.light,
              title: Text(L10n.t(context, 'light')),
            ),
            RadioListTile<ThemeMode>(
              value: ThemeMode.dark,
              title: Text(L10n.t(context, 'dark')),
            ),
          ],
        ),
      ),
"""
          if old_theme not in account:
              raise SystemExit('Expected theme radio block not found')
          account_path.write_text(account.replace(old_theme, new_theme))
          api_path = Path('mobile/customer_app/lib/core/api_client.dart')
          api = api_path.read_text()
          count = api.count('return send(false);')
          if count != 3:
              raise SystemExit(f'Expected exactly three retry returns, found {count}')
          api_path.write_text(api.replace('return send(false);', 'return await send(false);'))
          PY
          cd mobile/customer_app
          dart fix --apply
          dart format lib test tool/verify_customer_contract.dart
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          dart format --output=none --set-exit-if-changed lib test tool/verify_customer_contract.dart
      - name: Flutter analyzer must be clean
        working-directory: mobile/customer_app
        run: flutter analyze
      - name: Flutter unit and widget tests
        working-directory: mobile/customer_app
        run: flutter test --reporter expanded
      - name: Localization theme tests
        working-directory: mobile/customer_app
        run: flutter test test/localization_theme_test.dart --reporter expanded
      - name: Frozen Customer contract compatibility
        working-directory: mobile/customer_app
        run: dart run tool/verify_customer_contract.dart
      - name: Generate Android host preserving definitions
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --no-pub --platforms=android --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Android debug build
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Package corrected committed-source candidates
        shell: bash
        run: |
          set -euo pipefail
          out=mobile/customer_app/continuation2-evidence/corrected-source/mobile/customer_app
          mkdir -p "$out/tool"
          cp -R mobile/customer_app/lib "$out/"
          cp -R mobile/customer_app/test "$out/"
          cp mobile/customer_app/tool/verify_customer_contract.dart "$out/tool/"
          git diff -- mobile/customer_app/lib mobile/customer_app/test mobile/customer_app/tool/verify_customer_contract.dart > mobile/customer_app/continuation2-evidence/corrected-source.patch
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > mobile/customer_app/continuation2-evidence/source-sha.txt
      - name: Upload Continuation 2 source proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-customer-continuation2-source
          path: mobile/customer_app/continuation2-evidence
          if-no-files-found: warn
          retention-days: 7

  ios-preview:
    name: Continuation 2 unsigned iphoneos proof
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Select Xcode 26.3
        working-directory: mobile/customer_app
        shell: bash
        run: |
          mkdir -p continuation2-ios-evidence
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | tee continuation2-ios-evidence/xcode-version.txt
      - name: Generate iOS host preserving definitions
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --no-pub --platforms=ios --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Configure Flutter iOS project
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign --config-only
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          cd ios
          pod install
      - name: Direct unsigned iphoneos build
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build/ios-unsigned
          xcrun xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee continuation2-ios-evidence/xcodebuild-unsigned.log
          app=build/ios-unsigned/Build/Products/Debug-iphoneos/Runner.app
          test -d "$app"
          test -x "$app/Runner"
          file "$app/Runner" | tee continuation2-ios-evidence/runner-binary.txt
          xcrun lipo -info "$app/Runner" | tee continuation2-ios-evidence/runner-architecture.txt
          if codesign -dv "$app" > continuation2-ios-evidence/codesign-check.txt 2>&1; then
            echo 'Unexpected code signature on unsigned proof.'
            exit 1
          fi
          printf 'PASS — unsigned iphoneos build; signing explicitly disabled\n' > continuation2-ios-evidence/ios-unsigned-result.txt
      - name: Upload Continuation 2 iOS proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-customer-continuation2-ios
          path: mobile/customer_app/continuation2-ios-evidence
          if-no-files-found: warn
          retention-days: 7
