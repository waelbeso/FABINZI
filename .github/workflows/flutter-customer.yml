name: Flutter Customer Preparation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: flutter-customer-preparation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'work/flutter-customer-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify locked preparation source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "101b62220222f6372b11dfd5c76bd71aee1ab420"
          test -f mobile/customer_app/tool/prepare_checkpoint_fix.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Apply narrow hardening and exact Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          python mobile/customer_app/tool/prepare_checkpoint_fix.py
          cd mobile/customer_app
          flutter pub get
          dart --version
          dart format lib test tool/verify_customer_contract.dart
          test -s pubspec.lock
          cd ../..
          git checkout HEAD -- mobile/customer_app/analysis_options.yaml
          git diff --check
          git diff --exit-code 101b62220222f6372b11dfd5c76bd71aee1ab420...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
      - name: Commit prepared mobile tree only to working branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/flutter-customer.yml
          git config user.name "FABINZI CI"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/customer_app
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m "fix(mobile): complete Flutter verification hardening"
          git push origin HEAD:work/flutter-customer-app
