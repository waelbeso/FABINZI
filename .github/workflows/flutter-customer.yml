name: Flutter Customer

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-customer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  FLUTTER_INTEGRATION_BASE_SHA: 101b62220222f6372b11dfd5c76bd71aee1ab420

jobs:
  quality-android:
    name: Continuation 2 quality + Android proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source and branch locks
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse origin/feature/web-productization)" = "$FLUTTER_INTEGRATION_BASE_SHA"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Verify toolchain
        working-directory: mobile/customer_app
        shell: bash
        run: |
          flutter --version
          dart --version
      - name: Generate hosts and restore committed definitions
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --no-pub --platforms=android,ios --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          git diff --exit-code HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Verify frozen Customer API has no drift
        shell: bash
        run: |
          git diff --exit-code "$FLUTTER_INTEGRATION_BASE_SHA"...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
      - name: Apply Continuation 2 source corrections in workspace
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          python tool/continuation2_fix.py
          dart fix --apply
          dart format lib test tool/verify_customer_contract.dart
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          dart format --output=none --set-exit-if-changed lib test tool/verify_customer_contract.dart
      - name: Require clean analyzer
        working-directory: mobile/customer_app
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile/customer_app
        run: flutter test --reporter expanded
      - name: Run localization and theme proof
        working-directory: mobile/customer_app
        run: flutter test test/localization_theme_test.dart --reporter expanded
      - name: Verify frozen Customer contract compatibility
        working-directory: mobile/customer_app
        run: dart run tool/verify_customer_contract.dart
      - name: Android debug build
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Package corrected source proof
        shell: bash
        run: |
          set -euo pipefail
          out=mobile/customer_app/continuation2-proof/corrected-source/mobile/customer_app
          mkdir -p "$out/tool"
          cp -R mobile/customer_app/lib "$out/"
          cp -R mobile/customer_app/test "$out/"
          cp mobile/customer_app/tool/verify_customer_contract.dart "$out/tool/"
          git diff -- mobile/customer_app/lib mobile/customer_app/test mobile/customer_app/tool/verify_customer_contract.dart > mobile/customer_app/continuation2-proof/corrected-source.patch
      - name: Upload source proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-customer-continuation2-source
          path: mobile/customer_app/continuation2-proof
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: Continuation 2 unsigned iphoneos proof
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Select Xcode 26.3
        working-directory: mobile/customer_app
        shell: bash
        run: |
          mkdir -p continuation2-ios-proof
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | tee continuation2-ios-proof/xcode-version.txt
      - name: Generate iOS host and locked dependencies
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --empty --no-pub --platforms=ios --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Configure Flutter iOS project
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign --config-only
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          cd ios
          pod install
      - name: Build unsigned iphoneos application
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf build/ios-unsigned
          xcrun xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-unsigned \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee continuation2-ios-proof/xcodebuild.log
          app=build/ios-unsigned/Build/Products/Debug-iphoneos/Runner.app
          test -d "$app"
          test -x "$app/Runner"
          file "$app/Runner" | tee continuation2-ios-proof/runner-binary.txt
          xcrun lipo -info "$app/Runner" | tee continuation2-ios-proof/runner-architecture.txt
          if codesign -dv "$app" > continuation2-ios-proof/codesign-check.txt 2>&1; then
            echo 'Unexpected code signature on unsigned proof.'
            exit 1
          fi
          printf 'PASS — unsigned iphoneos build with signing explicitly disabled\n' > continuation2-ios-proof/result.txt
      - name: Upload iOS proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-customer-continuation2-ios
          path: mobile/customer_app/continuation2-ios-proof
          if-no-files-found: warn
          retention-days: 7
