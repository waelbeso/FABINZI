name: Manufacturer Payment Disclosure Fix

on: [pull_request]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: fabinzi
          POSTGRES_USER: fabinzi
          POSTGRES_PASSWORD: fabinzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.11
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://fabinzi:fabinzi@localhost:5432/fabinzi
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify checkpoint locks
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "11"
          test "${{ github.event.pull_request.head.ref }}" = "work/flutter-customer-app"
          test "${{ github.event.pull_request.base.ref }}" = "feature/web-productization"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "101b62220222f6372b11dfd5c76bd71aee1ab420"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release.txt
      - name: Install exact release dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip check
      - name: Prepare exact database
        run: |
          python manage.py reconcile_migration_state
          python manage.py migrate --noinput
      - name: Replace brittle raw substring checks with semantic disclosure assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_manufacturer_portal_acceptance.py')
          text = path.read_text()
          if 'import re\n' not in text:
              text = text.replace('from decimal import Decimal\n\n', 'from decimal import Decimal\nimport re\n\n', 1)

          old_detail = '    assert b"cod" not in response.content.lower()'
          new_detail = (
              '    # Search semantic payment UI, not the three-byte substring across raw HTML; generated tokens can collide.\n'
              '    assert data["order"].payment_method == "cod"\n'
              '    rendered = response.content.decode()\n'
              '    lowered = rendered.lower()\n'
              '    assert "payment_method" not in lowered\n'
              '    assert "payment method" not in lowered\n'
              '    assert "cash on delivery" not in lowered\n'
              '    assert re.search(r">\\s*cod\\s*<", rendered, re.IGNORECASE) is None'
          )
          if text.count(old_detail) != 1:
              raise SystemExit(f'Expected one production-detail raw cod assertion, found {text.count(old_detail)}')
          text = text.replace(old_detail, new_detail, 1)

          old_shipment = '    assert "cod" not in content.lower()'
          new_shipment = (
              '    assert data["order"].payment_method == "cod"\n'
              '    lowered = content.lower()\n'
              '    assert "payment_method" not in lowered\n'
              '    assert "payment method" not in lowered\n'
              '    assert "cash on delivery" not in lowered\n'
              '    assert re.search(r">\\s*cod\\s*<", content, re.IGNORECASE) is None'
          )
          if text.count(old_shipment) != 1:
              raise SystemExit(f'Expected one shipment raw cod assertion, found {text.count(old_shipment)}')
          text = text.replace(old_shipment, new_shipment, 1)
          path.write_text(text)
          PY
          rm -f tests/test_manufacturer_cod_diagnostic.py
          git diff --check
      - name: Focused Manufacturer payment-disclosure verification
        run: |
          pytest -q \
            tests/test_manufacturer_portal_acceptance.py::test_assigned_job_is_tenant_and_role_scoped \
            tests/test_manufacturer_portal_acceptance.py::test_shipment_surface_minimizes_customer_pii
      - name: Verify frozen contracts and commit narrow test correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 101b62220222f6372b11dfd5c76bd71aee1ab420...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
          git add tests/test_manufacturer_portal_acceptance.py tests/test_manufacturer_cod_diagnostic.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "FABINZI CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(manufacturer): assert payment non-disclosure semantically"
          git push origin HEAD:work/flutter-customer-app
