name: Flutter Auth Refresh Fix

on: [pull_request]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify checkpoint locks
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.number }}" = "11"
          test "${{ github.event.pull_request.head.ref }}" = "work/flutter-customer-app"
          test "${{ github.event.pull_request.base.ref }}" = "feature/web-productization"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "101b62220222f6372b11dfd5c76bd71aee1ab420"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Apply and verify refresh lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/customer_app
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          cd ../..
          python mobile/customer_app/tool/fix_refresh_lifecycle.py
          cd mobile/customer_app
          dart format lib/core/api_client.dart
          flutter analyze
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter test test/api_client_test.dart --reporter expanded
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Verify scope and commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code HEAD -- mobile/customer_app/pubspec.yaml mobile/customer_app/pubspec.lock mobile/customer_app/analysis_options.yaml
          git diff --exit-code 101b62220222f6372b11dfd5c76bd71aee1ab420...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
          rm mobile/customer_app/tool/fix_refresh_lifecycle.py
          git add mobile/customer_app/lib/core/api_client.dart mobile/customer_app/tool/fix_refresh_lifecycle.py
          git diff --cached --check
          git config user.name "FABINZI CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(mobile): serialize refresh cleanup without detached errors"
          git push origin HEAD:work/flutter-customer-app
