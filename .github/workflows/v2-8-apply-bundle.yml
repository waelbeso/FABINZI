name: V2-8 Apply Prepared Bundle

on:
  push:
    branches: [work/v2-finance-royalties-payables-payout]
  pull_request:
    branches: [feature/v2]
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/work/v2-finance-royalties-payables-payout' || github.head_ref == 'work/v2-finance-royalties-payables-payout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: work/v2-finance-royalties-payables-payout
          fetch-depth: 0
      - name: Verify accepted V2-7 baseline ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0b42bc8f6ff11f208cc22205a98c886bfa5705b9 HEAD
          test "$(git rev-parse 0b42bc8f6ff11f208cc22205a98c886bfa5705b9^{tree})" = "92c384e7ceb297d307cf02bdd273df7582d84842"
      - name: Apply prepared V2-8 implementation bundle
        run: |
          set -euo pipefail
          python tools/v2_8_apply_bundle.py
          if test -e tests/test_v2_8_finance.py; then
            mv tests/test_v2_8_finance.py tests/test_v2_8_finance_policy_payout.py
          fi
          rm -f tools/v2_8_apply_bundle.py
          rm -f tools/_v28_blob_*.tmp
          rm -rf tools/v2_8_bundle tools/v2_8_bundle_safe
          rm -f .github/workflows/v2-8-apply-bundle.yml
      - name: Verify transport artifacts removed and Python syntax
        run: |
          set -euo pipefail
          test ! -e tools/v2_8_apply_bundle.py
          test ! -e .github/workflows/v2-8-apply-bundle.yml
          test ! -d tools/v2_8_bundle
          test ! -d tools/v2_8_bundle_safe
          test -z "$(find tools -maxdepth 1 -name '_v28_blob_*.tmp' -print -quit)"
          test -e tests/test_v2_8_finance_policy_payout.py
          python -m compileall -q apps tests config
      - name: Commit implementation tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No implementation changes found"; exit 1; }
          git commit -m "Implement V2-8 finance policy, durable recognition, and payout"
          git push origin HEAD:work/v2-finance-royalties-payables-payout
