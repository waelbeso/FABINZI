name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: fabinzi
          POSTGRES_USER: fabinzi
          POSTGRES_PASSWORD: fabinzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.11
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://fabinzi:fabinzi@localhost:5432/fabinzi
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
      RELEASE_INTEGRATION_BASE_SHA: 802dc0f091287f778d4e623caa375a32c67f97dc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source checkout
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "FABINZI_SOURCE_SHA=$actual" >> "$GITHUB_ENV"
      - name: Verify release static and migration freeze
        shell: bash
        run: |
          git diff --exit-code "$RELEASE_INTEGRATION_BASE_SHA"...HEAD -- static/
          git diff --exit-code "$RELEASE_INTEGRATION_BASE_SHA"...HEAD -- ':(glob)apps/*/migrations/*.py'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release.txt
      - name: Install exact WEB v1.0 dependency resolution
        run: |
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py reconcile_migration_state
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py collectstatic --noinput
      - name: Production settings check
        env:
          DJANGO_DEBUG: "false"
          ENVIRONMENT: production
          PRIVATE_MEDIA_STORAGE_MODE: s3
          INTEGRATION_ENCRYPTION_KEY: ci-arbitrary-secret-managed-by-render
          FABINZI_PUBLIC_BASE_URL: https://fabinzi.example
          DJANGO_ALLOWED_HOSTS: fabinzi.example
          DJANGO_CSRF_TRUSTED_ORIGINS: https://fabinzi.example
          DJANGO_SECURE_SSL_REDIRECT: "true"
        run: python manage.py check --deploy
      - run: pytest -q
      - name: Capture WEB v1.0 release contract evidence
        shell: bash
        run: |
          mkdir -p artifacts/web-v1-release
          cp release-manifest.json RELEASE_MANIFEST.md CHANGELOG.md constraints-release.txt .python-version artifacts/web-v1-release/
          cp docs/WEB_V1_*.md artifacts/web-v1-release/
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path
          from config.release import APP_VERSION, RELEASE_LABEL, RELEASE_PYTHON_VERSION

          root = Path('.')
          def sha256(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()

          payload = {
              "release_label": RELEASE_LABEL,
              "application_version": APP_VERSION,
              "source_sha": os.environ["FABINZI_SOURCE_SHA"],
              "python_expected": RELEASE_PYTHON_VERSION,
              "python_runtime": platform.python_version(),
              "requirements_sha256": sha256("requirements.txt"),
              "constraints_sha256": sha256("constraints-release.txt"),
              "manifest_sha256": sha256("release-manifest.json"),
          }
          if payload["python_runtime"] != RELEASE_PYTHON_VERSION:
              raise SystemExit(f"Python runtime mismatch: {payload['python_runtime']}")
          Path("artifacts/web-v1-release/release-evidence.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY
          python manage.py showmigrations --plan > artifacts/web-v1-release/migration-plan.txt
          python -m pip freeze --all | sort > artifacts/web-v1-release/pip-freeze.txt
          python -m pip check > artifacts/web-v1-release/pip-check.txt
          git diff --name-status "$RELEASE_INTEGRATION_BASE_SHA"...HEAD > artifacts/web-v1-release/changed-files.txt
          find static -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/web-v1-release/static-source-sha256.txt
          find staticfiles -type f | wc -l > artifacts/web-v1-release/collected-static-file-count.txt
          sha256sum requirements.txt constraints-release.txt release-manifest.json > artifacts/web-v1-release/release-input-sha256.txt
      - name: Upload Web Productization browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-productization-browser-qa
          path: artifacts/browser-qa
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Designer Portal browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: designer-portal-browser-qa
          path: artifacts/designer-browser-qa
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Manufacturer Portal browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manufacturer-portal-browser-qa
          path: artifacts/manufacturer-browser-qa
          if-no-files-found: error
          retention-days: 14
      - name: Upload Control Center browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maneg-control-center-browser-qa
          path: artifacts/maneg-browser-qa
          if-no-files-found: error
          retention-days: 14
      - name: Upload Production Launch Gate browser QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-launch-gate
          path: artifacts/production-launch-gate
          if-no-files-found: error
          retention-days: 14
      - name: Upload WEB v1.0 release contract evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-v1-release-contract
          path: artifacts/web-v1-release
          if-no-files-found: error
          retention-days: 30
