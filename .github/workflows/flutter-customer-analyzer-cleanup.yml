name: Flutter Customer Analyzer Cleanup

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: flutter-customer-analyzer-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.number == 11 &&
      github.event.pull_request.head.ref == 'work/flutter-customer-app' &&
      github.event.pull_request.base.ref == 'feature/web-productization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify checkpoint locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "101b62220222f6372b11dfd5c76bd71aee1ab420"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Restore locked dependencies
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
      - name: Namespace Stripe APIs and apply supported Dart fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/customer_app/lib/features/cart/cart_screen.dart')
          text = path.read_text()
          replacements = {
              "import 'package:flutter_stripe/flutter_stripe.dart';": "import 'package:flutter_stripe/flutter_stripe.dart' as stripe;",
              'Stripe.instance': 'stripe.Stripe.instance',
              'SetupPaymentSheetParameters(': 'stripe.SetupPaymentSheetParameters(',
              'on StripeException catch': 'on stripe.StripeException catch',
              'FailureCode.Canceled': 'stripe.FailureCode.Canceled',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected Stripe token not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cd mobile/customer_app
          dart fix --apply
          dart format lib test tool/verify_customer_contract.dart
      - name: Require clean analyzer
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p cleanup-evidence
          flutter analyze 2>&1 | tee cleanup-evidence/analyze.log
          printf 'PASS — flutter analyze: No issues found\n' > cleanup-evidence/analyze-result.txt
      - name: Verify scope and frozen contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code HEAD -- mobile/customer_app/pubspec.yaml mobile/customer_app/pubspec.lock mobile/customer_app/analysis_options.yaml
          git diff --exit-code 101b62220222f6372b11dfd5c76bd71aee1ab420...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
          bad="$(git status --porcelain | awk '{print $2}' | grep -vE '^mobile/customer_app/(lib/|test/|tool/verify_customer_contract\.dart$|cleanup-evidence/)' || true)"
          test -z "$bad" || { printf '%s\n' "$bad"; exit 1; }
      - name: Commit analyzer-clean Flutter sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/customer_app/cleanup-evidence
          git add mobile/customer_app/lib mobile/customer_app/test mobile/customer_app/tool/verify_customer_contract.dart
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name "FABINZI CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(mobile): clear Flutter analyzer diagnostics"
          git push origin HEAD:work/flutter-customer-app
      - name: Upload analyzer cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-customer-analyzer-cleanup
          path: mobile/customer_app/cleanup-evidence
          if-no-files-found: warn
          retention-days: 7
