name: Final Pre-Main Release Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-pre-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CUSTOMER_API_FREEZE_SHA: 101b62220222f6372b11dfd5c76bd71aee1ab420
  ACCEPTED_FLUTTER_SHA: bbe1d36eeb149dd876e685da91823ae09f74fbc4
  FINAL_PRE_MAIN_BASE_SHA: bbe1d36eeb149dd876e685da91823ae09f74fbc4
  HISTORICAL_MAIN_SHA: 91f358c08d89557893e983f1c0d247fd1b42b15f

jobs:
  source-backend:
    name: Source security migrations + backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: fabinzi
          POSTGRES_USER: fabinzi
          POSTGRES_PASSWORD: fabinzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.11
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://fabinzi:fabinzi@localhost:5432/fabinzi
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact repository locks
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/pre-main-source
          mkdir -p "$out"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$(git rev-parse origin/feature/web-productization)" = "$FINAL_PRE_MAIN_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$HISTORICAL_MAIN_SHA"
          git merge-base --is-ancestor "$ACCEPTED_FLUTTER_SHA" HEAD
          printf '%s\n' "$actual" > "$out/candidate-sha.txt"
          printf '%s\n' "$FINAL_PRE_MAIN_BASE_SHA" > "$out/final-pre-main-base-sha.txt"
          printf '%s\n' "$ACCEPTED_FLUTTER_SHA" > "$out/accepted-flutter-sha.txt"
          printf '%s\n' "$HISTORICAL_MAIN_SHA" > "$out/main-sha.txt"
          printf 'PASS\n' > "$out/repository-lock-result.txt"
      - name: Frozen Customer API zero drift
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/pre-main-source
          git diff --exit-code "$CUSTOMER_API_FREEZE_SHA"...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
          sha256sum \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json > "$out/frozen-contract-sha256.txt"
          printf 'PASS — seven frozen files unchanged\n' > "$out/frozen-api-result.txt"
      - name: Repository hygiene CI permissions and secrets
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/pre-main-source
          git ls-files | sort > "$out/tracked-files.txt"
          if git ls-files | grep -E '(^|/)\.env$'; then exit 1; fi
          if git ls-files | grep -Ei '(^|/)(continuation|autofix|one[-_]?shot|fixer)([-_/]|$)'; then exit 1; fi
          if git ls-files | grep -E '(^|/)(build|\.dart_tool|Pods|\.gradle|__pycache__)(/|$)|\.pyc$'; then exit 1; fi
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            [ "$file" = ".github/workflows/final-pre-main-release-gate.yml" ] && continue
            if grep -nE 'contents:[[:space:]]*write|git[[:space:]]+push([[:space:]]|$)' "$file"; then
              echo "Repository-writing workflow construct found in $file" >&2
              exit 1
            fi
          done
          grep -q '^permissions:' .github/workflows/final-pre-main-release-gate.yml
          grep -q '^  contents: read$' .github/workflows/final-pre-main-release-gate.yml
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'\b(?:sk|rk)_live_[A-Za-z0-9]{16,}\b'),
              re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
              re.compile(r'\bgh[pousr]_[A-Za-z0-9]{30,}\b'),
              re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b'),
              re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b'),
          ]
          skip = {'.github/workflows/final-pre-main-release-gate.yml'}
          hits=[]
          for name in subprocess.check_output(['git','ls-files'], text=True).splitlines():
              if name in skip: continue
              p=Path(name)
              try: data=p.read_bytes()
              except OSError: continue
              if b'\0' in data or len(data)>2_000_000: continue
              text=data.decode('utf-8', errors='ignore')
              if any(rx.search(text) for rx in patterns): hits.append(name)
          if hits: raise SystemExit('High-confidence secret pattern: '+repr(hits))
          Path('artifacts/pre-main-source/secrets-pattern-audit.txt').write_text('PASS — no high-confidence tracked-source secret patterns\n')
          PY
          printf 'PASS — no tracked env/build/temp mutation paths; no explicit workflow write/push construct; gate token is read-only\n' > "$out/repository-hygiene-ci-permissions.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release.txt
      - name: Dependencies migrations Django static production
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/pre-main-source
          python --version | tee "$out/python-version.txt"
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip check | tee "$out/pip-check.txt"
          python -m pip freeze --all | sort > "$out/pip-freeze.txt"
          python manage.py makemigrations --check --dry-run | tee "$out/makemigrations-check.txt"
          git diff --name-only "$HISTORICAL_MAIN_SHA"...HEAD -- ':(glob)apps/*/migrations/*.py' | sort > "$out/migrations-since-main.txt"
          python - <<'PY'
          from pathlib import Path
          expected={'apps/checkout/migrations/0002_commerce_parent_cart.py','apps/storefront/migrations/0002_visual_studio_elements.py'}
          found=set(Path('artifacts/pre-main-source/migrations-since-main.txt').read_text().splitlines())
          assert found==expected,(found,expected)
          for name in found:
              text=Path(name).read_text()
              for marker in ('migrations.DeleteModel','migrations.RemoveField','migrations.RenameModel','migrations.RenameField','migrations.RunSQL'):
                  assert marker not in text,(name,marker)
          checkout=Path('apps/checkout/migrations/0002_commerce_parent_cart.py').read_text()
          assert 'backfill_customer_purchases' in checkout and '.delete(' not in checkout
          Path('artifacts/pre-main-source/migration-safety-review.txt').write_text('PASS — deterministic additive migration delta; commerce backfill has no deletion\n')
          PY
          python manage.py reconcile_migration_state | tee "$out/reconcile-migration-state.txt"
          python manage.py migrate --noinput | tee "$out/fresh-migrate.txt"
          python manage.py showmigrations --plan > "$out/migration-plan.txt"
          python manage.py check | tee "$out/django-check.txt"
          python manage.py collectstatic --noinput | tee "$out/collectstatic.txt"
          find staticfiles -type f | wc -l | tr -d ' ' > "$out/collected-static-file-count.txt"
          DJANGO_DEBUG=false ENVIRONMENT=production PRIVATE_MEDIA_STORAGE_MODE=s3 \
          INTEGRATION_ENCRYPTION_KEY=ci-arbitrary-secret-managed-by-render \
          FABINZI_PUBLIC_BASE_URL=https://fabinzi.example DJANGO_ALLOWED_HOSTS=fabinzi.example \
          DJANGO_CSRF_TRUSTED_ORIGINS=https://fabinzi.example DJANGO_SECURE_SSL_REDIRECT=true \
          python manage.py check --deploy | tee "$out/production-check.txt"
      - name: Full backend suite and release source audit
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          out=artifacts/pre-main-source
          pytest -q 2>&1 | tee /tmp/backend-tests.log
          tail -n 12 /tmp/backend-tests.log > "$out/backend-tests-result.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          from config.release import APP_VERSION, RELEASE_LABEL, RELEASE_PYTHON_VERSION
          assert (APP_VERSION,RELEASE_LABEL,RELEASE_PYTHON_VERSION)==('1.0.0','FABINZI WEB v1.0','3.12.14')
          m=json.loads(Path('release-manifest.json').read_text())
          assert m['version']=='1.0.0' and m['release_label']=='FABINZI WEB v1.0'
          assert m['deferred_live_e2e']['status']=='UNRESOLVED'
          assert 'Status: **UNRESOLVED' in Path('docs/DEFERRED_LIVE_E2E.md').read_text()
          render=Path('render.yaml').read_text()
          for x in ('name: fabinzi-web','name: fabinzi-db','name: fabinzi-redis','name: fabinzi-worker','name: fabinzi-beat','value: s3','healthCheckPath: /readyz/','branch: main'): assert x in render,x
          start=Path('render-start.sh').read_text()
          for x in ('reconcile_migration_state','migrate --noinput','collectstatic --noinput','gunicorn config.wsgi:application'): assert x in start,x
          checks=[
            ('apps/checkout/models.py','class CustomerPurchase'),
            ('apps/checkout/models.py','related_name="child_orders"'),
            ('mobile/customer_app/lib/core/config.dart','stripePublishableKey'),
            ('mobile/customer_app/lib/core/secure_store.dart','FlutterSecureStorage'),
            ('apps/media/manufacturer_views.py','require_manufacturer_job_access'),
            ('apps/integrations/admin_site.py','AdminSiteOTPRequired'),
            ('config/settings.py','"ROTATE_REFRESH_TOKENS": True'),
            ('config/settings.py','"BLACKLIST_AFTER_ROTATION": True'),
          ]
          for name,needle in checks: assert needle in Path(name).read_text(),(name,needle)
          Path('artifacts/pre-main-source/release-cross-surface-audit.txt').write_text('PASS — release identity, Render source topology, parent/child commerce, mobile secure storage, Manufacturer scope, MFA and JWT rotation/blacklist\n')
          PY
          cat > "$out/external-production-configuration-required.txt" <<'EOF'
          EXTERNAL PRODUCTION CONFIGURATION STILL REQUIRED
          - Explicitly authorized merge of the accepted release into main, then actual Render deployment.
          - Stable production Django/integration-encryption secrets.
          - Production S3 IntegrationConfig, bucket/credentials and authorization validation.
          - Payment/webhook credentials only for intentionally enabled Stripe/Paymob providers.
          - Optional Mailgun/Twilio/Sentry credentials where enabled.
          - Actual Celery worker/Beat runtime-health validation.
          - Actual PostgreSQL recovery window/export state and operator restore drill.
          - Apple/Google signing/store credentials and publication are outside this source gate.
          - Deferred Global Live E2E remains unresolved until its later authorized execution.
          EOF
          git diff --name-status "$FINAL_PRE_MAIN_BASE_SHA"...HEAD > "$out/changed-files.txt"
      - name: Upload source backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-main-source-backend-evidence
          path: artifacts/pre-main-source
          if-no-files-found: error
          retention-days: 30

  flutter-quality:
    name: Flutter quality + Android evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact source locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "$FINAL_PRE_MAIN_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$HISTORICAL_MAIN_SHA"
          git merge-base --is-ancestor "$ACCEPTED_FLUTTER_SHA" HEAD
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Flutter full quality Android evidence
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          out=pre-main-evidence
          mkdir -p "$out"
          flutter --version --machine | tee "$out/flutter-version.json"
          dart --version 2>&1 | tee "$out/dart-version.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('pre-main-evidence/flutter-version.json').read_text())
          assert d['frameworkVersion']=='3.47.0' and d['dartSdkVersion'].startswith('3.13.'),d
          PY
          flutter create --empty --no-pub --platforms=android,ios --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          git diff --exit-code HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          sha256sum pubspec.lock > "$out/pubspec-lock-sha256.txt"
          flutter pub deps --style=compact > "$out/resolved-dependencies.txt"
          grep -A7 -E '^  (flutter_stripe|stripe_ios|stripe_android|stripe_platform_interface):' pubspec.lock > "$out/stripe-resolution.txt"
          git -C ../.. diff --exit-code "$CUSTOMER_API_FREEZE_SHA"...HEAD -- \
            docs/api/fabinzi-customer-api-v1.openapi.json docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json
          dart format --output=none --set-exit-if-changed lib test tool/verify_customer_contract.dart
          printf 'PASS — formatter\n' > "$out/format-result.txt"
          flutter analyze 2>&1 | tee /tmp/analyze.log
          grep -F 'No issues found!' /tmp/analyze.log
          printf 'PASS — No issues found\n' > "$out/analyze-result.txt"
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-tests.log
          grep -F 'checkout submission guard allows only one active placement per checkout' /tmp/flutter-tests.log
          grep -F 'checkout placement sends the persisted Idempotency-Key unchanged' /tmp/flutter-tests.log
          grep -F 'Studio quantity update uses the frozen PATCH quantity field' /tmp/flutter-tests.log
          printf 'PASS — full Flutter tests including auth/session/refresh, idempotency and Studio quantity\n' > "$out/flutter-tests-result.txt"
          flutter test test/localization_theme_test.dart --reporter expanded >/tmp/localization.log 2>&1
          printf 'PASS — English/LTR, Arabic/RTL, Light/Dark/System\n' > "$out/localization-theme-result.txt"
          dart run tool/verify_customer_contract.dart > "$out/customer-contract.txt"
          printf 'PASS — frozen Customer API compatibility\n' > "$out/customer-contract-result.txt"
          flutter build apk --debug >/tmp/android.log 2>&1
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" > "$out/android-build-sha256.txt"
          printf 'PASS — Android debug build\n' > "$out/android-build-result.txt"
      - name: Upload Flutter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-main-flutter-evidence
          path: mobile/customer_app/pre-main-evidence
          if-no-files-found: error
          retention-days: 30

  flutter-ios:
    name: Real unsigned iphoneos evidence
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact source locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "$FINAL_PRE_MAIN_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$HISTORICAL_MAIN_SHA"
          git merge-base --is-ancestor "$ACCEPTED_FLUTTER_SHA" HEAD
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Xcode and genuine unsigned device build
        working-directory: mobile/customer_app
        shell: bash
        run: |
          set -euo pipefail
          out=pre-main-ios-evidence
          mkdir -p "$out"
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version | tee "$out/xcode-version.txt"
          flutter create --empty --no-pub --platforms=ios --org com.fabinzi --project-name fabinzi_customer_app .
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter pub get --enforce-lockfile
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          flutter build ios --debug --no-codesign --config-only
          git checkout HEAD -- pubspec.yaml pubspec.lock analysis_options.yaml
          cd ios && pod install && cd ..
          rm -rf build/ios-unsigned
          xcrun xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios-unsigned \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' PROVISIONING_PROFILE_SPECIFIER='' COMPILER_INDEX_STORE_ENABLE=NO \
            build >/tmp/ios-build.log 2>&1
          app=build/ios-unsigned/Build/Products/Debug-iphoneos/Runner.app
          test -d "$app" && test -x "$app/Runner"
          file "$app/Runner" | tee "$out/runner-binary.txt"
          xcrun lipo -info "$app/Runner" | tee "$out/runner-architecture.txt"
          if codesign -dv "$app" > "$out/codesign-check.txt" 2>&1; then exit 1; fi
          printf 'PASS — genuine unsigned iphoneos generic device build; signing disabled\n' > "$out/ios-build-result.txt"
      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-main-ios-evidence
          path: mobile/customer_app/pre-main-ios-evidence
          if-no-files-found: error
          retention-days: 30

  final-evidence:
    name: Final Pre-Main release evidence
    runs-on: ubuntu-latest
    needs: [source-backend, flutter-quality, flutter-ios]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pre-main-source-backend-evidence
          path: evidence/source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pre-main-flutter-evidence
          path: evidence/flutter
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pre-main-ios-evidence
          path: evidence/ios
      - name: Assemble final non-secret artifact
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/final-pre-main-release-gate
          mkdir -p "$out/source" "$out/flutter" "$out/ios"
          cp -R evidence/source/. "$out/source/"
          cp -R evidence/flutter/. "$out/flutter/"
          cp -R evidence/ios/. "$out/ios/"
          cp docs/WEB_V1_LIMITATIONS.md "$out/"
          cp mobile/customer_app/KNOWN_LIMITATIONS.md "$out/FLUTTER_KNOWN_LIMITATIONS.md"
          cp docs/DEFERRED_LIVE_E2E.md "$out/"
          printf '%s\n' "$(git rev-parse HEAD)" > "$out/candidate-sha.txt"
          cat > "$out/integration-record.txt" <<EOF
          pre_integration_feature_sha=101b62220222f6372b11dfd5c76bd71aee1ab420
          accepted_flutter_sha=$ACCEPTED_FLUTTER_SHA
          integration_method=non-forced fast-forward
          resulting_feature_sha=$FINAL_PRE_MAIN_BASE_SHA
          historical_main_sha=$HISTORICAL_MAIN_SHA
          EOF
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          out=Path('artifacts/final-pre-main-release-gate')
          f=json.loads((out/'flutter/flutter-version.json').read_text())
          payload={
            'checkpoint':'FABINZI — Final Pre-Main Release Gate',
            'candidate_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'accepted_flutter_sha':'bbe1d36eeb149dd876e685da91823ae09f74fbc4',
            'pre_integration_feature_sha':'101b62220222f6372b11dfd5c76bd71aee1ab420',
            'integration_method':'non-forced fast-forward',
            'resulting_feature_sha':'bbe1d36eeb149dd876e685da91823ae09f74fbc4',
            'historical_main_sha':'91f358c08d89557893e983f1c0d247fd1b42b15f',
            'python':'3.12.14','backend':'PASS','migrations':'PASS','production_check':'PASS',
            'web_release':'FABINZI WEB v1.0 / 1.0.0','customer_api_zero_drift':'PASS',
            'flutter':f['frameworkVersion'],'dart':f['dartSdkVersion'],'flutter_revision':f.get('frameworkRevision'),
            'flutter_quality_android':'PASS','ios_unsigned_iphoneos':'PASS','repository_hygiene':'PASS',
            'ci_permission_audit':'PASS','secrets_pattern_audit':'PASS','cross_surface':'PASS',
            'render_source_side_readiness':'PASS — external production configuration still required',
            'deferred_global_live_e2e':'UNRESOLVED','production_deployed_by_checkpoint':False,
          }
          (out/'final-pre-main-manifest.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload final pre-main release gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-pre-main-release-gate
          path: artifacts/final-pre-main-release-gate
          if-no-files-found: error
          retention-days: 30
