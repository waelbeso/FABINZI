name: V2-8 Focused

on:
  pull_request:
    branches: [feature/v2]

permissions:
  contents: read

jobs:
  focused:
    if: github.head_ref == 'work/v2-finance-royalties-payables-payout'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: fabinzi
          POSTGRES_USER: fabinzi
          POSTGRES_PASSWORD: fabinzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.11
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://fabinzi:fabinzi@localhost:5432/fabinzi
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
      INTEGRATION_ENCRYPTION_KEY: v2-8-synthetic-ci-encryption-key-not-production
      CUSTOMER_API_V1_FREEZE_BASE_SHA: 8868572e26aa0711598cf85dd7922371f87fba92
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact V2-8 source checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 0b42bc8f6ff11f208cc22205a98c886bfa5705b9 HEAD
          test "$(git rev-parse 0b42bc8f6ff11f208cc22205a98c886bfa5705b9^{tree})" = "92c384e7ceb297d307cf02bdd273df7582d84842"
      - name: Verify frozen Customer API v1 no drift
        run: |
          git diff --exit-code "$CUSTOMER_API_V1_FREEZE_BASE_SHA"...HEAD -- \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release.txt
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip check
      - name: Validate Golden reference metadata
        run: python tools/verify_golden_reference_packages.py --manifest contracts/golden-reference-v1-integrity.json --metadata-only
      - name: Verify syntax and migration drift
        run: |
          python -m compileall -q apps tests config
          python manage.py makemigrations --check --dry-run
      - name: Verify zero-table PostgreSQL then migrate
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db import connection
          tables = sorted(connection.introspection.table_names())
          if tables:
              raise SystemExit(f"Expected zero-table PostgreSQL schema; found: {tables}")
          print("Fresh PostgreSQL schema verified: zero tables before migration.")
          PY
          python manage.py migrate --noinput
          python manage.py check
          python manage.py collectstatic --noinput --clear >/tmp/v2_8_collectstatic.log
      - name: Run focused V2-8 regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/v2-8-focused
          pytest -q \
            tests/test_v2_8_finance_policy_payout.py \
            tests/test_v2_8_finance_boundaries.py \
            tests/test_stage8_finance.py \
            tests/test_v2_6_pricing_parent_purchase.py \
            tests/test_v2_7_routing_boundaries.py \
            tests/test_v2_7_offers_specification.py \
            tests/test_v2_7_operations_security.py \
            tests/test_v2_7_wiring_maneg.py \
            tests/test_private_media_hardening.py \
            tests/test_manufacturer_portal_security_edges.py \
            --junitxml=artifacts/v2-8-focused/junit.xml \
            2>&1 | tee artifacts/v2-8-focused/pytest.txt
      - name: Upload V2-8 focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-8-focused-test-evidence
          path: artifacts/v2-8-focused
          if-no-files-found: error
          retention-days: 30
