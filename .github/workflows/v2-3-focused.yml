name: V2-3 Focused

on:
  pull_request:
    branches: [feature/v2]

permissions:
  contents: read

jobs:
  focused:
    if: github.head_ref == 'work/v2-subscriptions-entitlements-team'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: fabinzi
          POSTGRES_USER: fabinzi
          POSTGRES_PASSWORD: fabinzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4.11
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://fabinzi:fabinzi@localhost:5432/fabinzi
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
      CUSTOMER_API_V1_FREEZE_BASE_SHA: 8868572e26aa0711598cf85dd7922371f87fba92
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact V2-3 source checkout
        shell: bash
        run: |
          expected="${{ github.event.pull_request.head.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "V2_3_SOURCE_SHA=$actual"
      - name: Verify frozen Customer API v1 no drift
        run: |
          git diff --exit-code "$CUSTOMER_API_V1_FREEZE_BASE_SHA"...HEAD -- \
            contracts/customer-api-v1-manifest.json \
            contracts/customer-api-v1-fixtures.json \
            docs/api/fabinzi-customer-api-v1.openapi.json \
            docs/API_V1_CUSTOMER_CONTRACT.md \
            docs/FLUTTER_API_HANDOFF.md \
            docs/CUSTOMER_API_V1_ENDPOINT_INVENTORY.md \
            docs/API_V1_CUSTOMER_REPRODUCIBILITY.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release.txt
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip check
      - name: Validate Golden reference integrity metadata
        run: python tools/verify_golden_reference_packages.py --manifest contracts/golden-reference-v1-integrity.json --metadata-only
      - name: Verify migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Verify fresh PostgreSQL migration start
        run: |
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db import connection
          tables = sorted(connection.introspection.table_names())
          if tables:
              raise SystemExit(f"Expected zero-table PostgreSQL schema; found: {tables}")
          print("Fresh PostgreSQL schema verified: zero tables before migration.")
          PY
      - name: Apply zero-to-current migrations
        run: python manage.py migrate --noinput
      - name: Django check
        run: python manage.py check
      - name: Run focused V2-3 tests
        run: pytest -q tests/test_v2_subscriptions_entitlements_team.py
      - name: Recompute canonical brand SHA-256
        run: sha256sum static/brand/fabinzi-logo.svg static/brand/fabinzi-icon.svg
