name: Studio Isolated Diagnostic
on:
  pull_request:
    branches: [feature/web-productization]

jobs:
  studio-isolated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fabinzi
          POSTGRES_USER: fabinzi
          POSTGRES_PASSWORD: fabinzi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: postgresql://fabinzi:fabinzi@localhost:5432/fabinzi
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
      CI: "true"
    steps:
      - name: Checkout exact red-run head under diagnosis
        uses: actions/checkout@v4
        with:
          ref: 9a00f0e1d2b859f1beaecb9316a8abca858fc65c
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Isolated Studio browser run 1
        run: pytest -s -vv tests/test_artwork_studio_browser.py::test_artwork_marketplace_and_visual_studio_desktop_journeys
      - name: Isolated Studio browser run 2
        run: pytest -s -vv tests/test_artwork_studio_browser.py::test_artwork_marketplace_and_visual_studio_desktop_journeys
      - name: Isolated Studio browser run 3
        run: pytest -s -vv tests/test_artwork_studio_browser.py::test_artwork_marketplace_and_visual_studio_desktop_journeys
