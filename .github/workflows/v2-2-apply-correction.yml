name: V2-2 Apply Final Correction

on:
  push:
    branches:
      - work/v2-applications-organizations
    paths:
      - .github/workflows/v2-2-apply-correction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-not-production-but-long-enough-for-django-checks-123456
      DJANGO_DEBUG: "true"
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///db.sqlite3
      REDIS_URL: redis://localhost:6379/0
      FABINZI_PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/v2-applications-organizations
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release.txt
      - name: Apply prepared V2-2 correction
        shell: bash
        run: |
          base64 -d .github/v2-2-final-corrections.patch.gz.b64 | gzip -d > /tmp/v2-2-final-corrections.patch
          git apply --check /tmp/v2-2-final-corrections.patch
          git apply /tmp/v2-2-final-corrections.patch
          rm -f .github/v2-2-final-corrections.patch.gz.b64 .github/workflows/v2-2-apply-correction.yml
          test ! -e tests/test_v2_source_export_temp.py
      - name: Quick Python compilation
        run: python -m compileall -q apps tests
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip check
      - name: Verify makemigrations consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Commit substantive V2-2 correction
        shell: bash
        run: |
          git config user.name "Wael El-Begearmi"
          git config user.email "waelabbas@live.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v2-2): finalize applications organizations corrections"
          git push origin HEAD:work/v2-applications-organizations
