name: Flutter Analyzer Preparation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: flutter-analyzer-prep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event.pull_request.head.ref == 'work/flutter-customer-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify checkpoint branch locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/feature/web-productization)" = "101b62220222f6372b11dfd5c76bd71aee1ab420"
          test "$(git rev-parse origin/main)" = "91f358c08d89557893e983f1c0d247fd1b42b15f"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Apply SDK analyzer fixes only
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/customer_app
          cp pubspec.yaml /tmp/fabinzi-pubspec.yaml
          cp pubspec.lock /tmp/fabinzi-pubspec.lock
          cp analysis_options.yaml /tmp/fabinzi-analysis_options.yaml
          flutter pub get --enforce-lockfile
          dart fix --apply
          dart format lib test tool/verify_customer_contract.dart
          cmp -s pubspec.yaml /tmp/fabinzi-pubspec.yaml
          cmp -s pubspec.lock /tmp/fabinzi-pubspec.lock
          cmp -s analysis_options.yaml /tmp/fabinzi-analysis_options.yaml
          cd ../..
          git diff --check
      - name: Commit source-only analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          git add mobile/customer_app/lib mobile/customer_app/test mobile/customer_app/tool/verify_customer_contract.dart
          if git diff --cached --quiet; then
            echo 'No SDK autofixes remain.'
            exit 0
          fi
          git config user.name 'FABINZI CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'style(mobile): apply analyzer-safe Dart fixes'
          git push origin HEAD:work/flutter-customer-app
