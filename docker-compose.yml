services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fabinzi
      POSTGRES_USER: fabinzi
      POSTGRES_PASSWORD: fabinzi
    ports: ["5432:5432"]
    volumes: ["fabinzi_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  fabinzi_pg:
